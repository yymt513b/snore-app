<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snore & SAS Monitor Lite</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-green: #00e676;
            --warn-yellow: #ffb300;
            --alert-red: #ff5252;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }
        h1 { font-size: 1.2rem; text-align: center; margin: 8px 0 16px; }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: var(--accent-green);
            color: #000;
            cursor: pointer;
            margin-bottom: 6px;
        }
        .btn-test {
            background: #333;
            color: #fff;
            padding: 10px;
            font-size: 0.85rem;
        }
        .btn-clear {
            background: #333;
            color: #ff5252;
            padding: 8px;
            font-size: 0.75rem;
            margin-top: 12px;
            border: 1px solid #444;
            width: 100%;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
            margin-top: 8px;
        }
        .summary-item {
            background: #2a2a2a;
            padding: 8px;
            border-radius: 8px;
        }
        .summary-val {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 4px;
        }

        /* 横スクロール対応コンテナ */
        .timeline-wrapper {
            width: 100%;
            overflow-x: auto;
            background: #080808;
            border-radius: 6px;
            margin-top: 8px;
            -webkit-overflow-scrolling: touch;
        }
        .canvas-container {
            height: 160px;
            position: relative;
            min-width: 100%;
        }
        canvas {
            height: 100%;
            display: block;
        }

        .tab-container {
            display: flex;
            gap: 4px;
            margin-bottom: 12px;
            border-bottom: 1px solid #333;
            padding-bottom: 4px;
        }
        .tab-btn {
            flex: 1;
            padding: 8px 4px;
            background: #2a2a2a;
            color: var(--text-sub);
            border: none;
            border-radius: 6px 6px 0 0;
            font-size: 0.8rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .tab-btn.active {
            background: var(--accent-green);
            color: #000000;
        }

        .event-item {
            border-bottom: 1px solid #333;
            padding: 10px 0;
        }
        .event-tag {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .tag-sas { background: var(--alert-red); color: #fff; }
        .tag-snore { background: var(--warn-yellow); color: #000; }
        audio { width: 100%; height: 36px; margin-top: 6px; }
        .note { font-size: 0.75rem; color: var(--text-sub); text-align: center; }

        #dimmerOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            opacity: 0.99;
            z-index: 99999;
            color: #333333;
            text-align: center;
            padding-top: 40vh;
            font-size: 0.85rem;
            box-sizing: border-box;
            user-select: none;
        }
    </style>
</head>
<body>

    <div id="dimmerOverlay">
        画面をタップすると表示が戻ります<br>
        <span style="font-size:0.75rem; color:#222;">(計測継続中)</span>
    </div>

    <video id="noSleepVideo" playsinline loop muted style="display:none; width:1px; height:1px;">
        <source src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28ybXA0MQAAAAhmcmVlAAAAAG1kYXQAAAA=" type="video/mp4">
    </video>

    <h1>いびき・SAS 睡眠モニター</h1>

    <div class="card">
        <button id="toggleBtn" class="btn">計測を開始する</button>
        <button id="testBtn" class="btn btn-test">動作テスト（15秒切り出し再生）</button>
        <div id="wakeLockStatus" class="note">スリープ防止: 未設定</div>
        <div id="mimeStatus" class="note" style="color:#81c784; margin-top:4px;"></div>
    </div>

    <div class="card">
        <div style="font-weight: bold; font-size: 0.9rem;">昨夜の計測サマリー</div>
        <div class="summary-grid">
            <div class="summary-item">
                <div style="font-size: 0.75rem; color: var(--text-sub);">危険検知</div>
                <div id="summaryAlerts" class="summary-val" style="color: var(--alert-red);">0 回</div>
            </div>
            <div class="summary-item">
                <div style="font-size: 0.75rem; color: var(--text-sub);">最長無音</div>
                <div id="summaryMaxSilence" class="summary-val">0 秒</div>
            </div>
            <div class="summary-item">
                <div style="font-size: 0.75rem; color: var(--text-sub);">いびき率</div>
                <div id="summarySnoreRatio" class="summary-val">0 %</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
            <span>音量タイムライン (5秒集約・指でスクロール可)</span>
            <span id="liveStatus" style="color: var(--accent-green);">停止中</span>
        </div>
        <div class="timeline-wrapper" id="timelineWrapper">
            <div class="canvas-container" id="canvasContainer">
                <canvas id="timelineCanvas"></canvas>
            </div>
        </div>
    </div>

    <div class="card">
        <div style="font-weight: bold; font-size: 0.9rem; margin-bottom: 8px;">
            危険音声保存ログ (過去3日分)
        </div>

        <div class="tab-container" id="tabContainer">
            <button class="tab-btn active" data-day="0">今日</button>
            <button class="tab-btn" data-day="1">1日前</button>
            <button class="tab-btn" data-day="2">2日前</button>
        </div>

        <div id="eventList">
            <p style="color: var(--text-sub); font-size: 0.85rem; text-align: center;">選択された日の保存データはありません。</p>
        </div>
        
        <button id="clearBtn" class="btn btn-clear">保存ログをすべて削除</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const SILENCE_DB = -45;
            const SNORE_DB = -30;
            const SPIKE_DB = -20;
            const MIN_SILENCE_SEC = 10;
            const RETENTION_DAYS = 3;
            const DOWNSAMPLE_SEC = 5; // 5秒ごとに1データにダウンサンプリング

            let audioContext, analyser, microphone, mediaRecorder;
            let wakeLock = null;
            let isRunning = false;
            let selectedMimeType = '';
            let db;
            let activeDayIndex = 0;
            
            let timelineData = []; 
            let secBuffer = []; // 5秒分の生データを一時保持
            let ringBuffer = [];   
            let events = [];       

            let currentSilenceSec = 0;
            let maxSilenceSec = 0;
            let alertCount = 0;
            let snoreSeconds = 0;
            let totalRecordedSeconds = 0;

            const toggleBtn = document.getElementById('toggleBtn');
            const testBtn = document.getElementById('testBtn');
            const clearBtn = document.getElementById('clearBtn');
            const liveStatus = document.getElementById('liveStatus');
            const wakeLockStatus = document.getElementById('wakeLockStatus');
            const mimeStatus = document.getElementById('mimeStatus');
            const canvas = document.getElementById('timelineCanvas');
            const canvasContainer = document.getElementById('canvasContainer');
            const timelineWrapper = document.getElementById('timelineWrapper');
            const ctx = canvas.getContext('2d');
            const dimmerOverlay = document.getElementById('dimmerOverlay');
            const noSleepVideo = document.getElementById('noSleepVideo');
            const tabContainer = document.getElementById('tabContainer');

            // IndexedDB 構築
            const dbReq = indexedDB.open('SnoreSASMonitorDB', 1);
            dbReq.onupgradeneeded = (e) => {
                const database = e.target.result;
                if (!database.objectStoreNames.contains('events')) {
                    database.createObjectStore('events', { keyPath: 'id', autoIncrement: true });
                }
            };
            dbReq.onsuccess = (e) => {
                db = e.target.result;
                loadEventsFromDB();
            };

            function saveEventToDB(eventObj) {
                if (!db) return;
                const tx = db.transaction('events', 'readwrite');
                tx.objectStore('events').add(eventObj);
            }

            function loadEventsFromDB() {
                if (!db) return;
                const tx = db.transaction('events', 'readonly');
                const store = tx.objectStore('events');
                const req = store.getAll();
                req.onsuccess = () => {
                    const now = Date.now();
                    const expireTime = RETENTION_DAYS * 24 * 60 * 60 * 1000;
                    
                    events = req.result.filter(item => {
                        if (now - item.timestamp > expireTime) {
                            deleteEventFromDB(item.id);
                            return false;
                        }
                        return true;
                    }).reverse();

                    updateTabLabels();
                    renderEvents();
                };
            }

            function deleteEventFromDB(id) {
                if (!db) return;
                const tx = db.transaction('events', 'readwrite');
                tx.objectStore('events').delete(id);
            }

            clearBtn.addEventListener('click', () => {
                if (confirm("過去3日分の保存音声ログをすべて削除しますか？")) {
                    if (!db) return;
                    const tx = db.transaction('events', 'readwrite');
                    tx.objectStore('events').clear();
                    events = [];
                    renderEvents();
                }
            });

            tabContainer.addEventListener('click', (e) => {
                if (e.target.classList.contains('tab-btn')) {
                    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
                    e.target.classList.add('active');
                    activeDayIndex = parseInt(e.target.getAttribute('data-day'), 10);
                    renderEvents();
                }
            });

            function updateTabLabels() {
                const today = new Date();
                const buttons = tabContainer.querySelectorAll('.tab-btn');
                
                buttons.forEach((btn, idx) => {
                    const targetDate = new Date();
                    targetDate.setDate(today.getDate() - idx);
                    const dateStr = `${targetDate.getMonth() + 1}/${targetDate.getDate()}`;
                    if (idx === 0) btn.innerText = `今日 (${dateStr})`;
                    else if (idx === 1) btn.innerText = `昨日 (${dateStr})`;
                    else btn.innerText = `${idx}日前 (${dateStr})`;
                });
            }

            // 安全な動的キャンバスリサイズ（1データ＝4px幅で無理なく拡張）
            function resizeCanvas() {
                if (!canvas) return;
                const minWidth = timelineWrapper.clientWidth;
                const calculatedWidth = Math.max(minWidth, timelineData.length * 4);
                
                canvasContainer.style.width = calculatedWidth + 'px';
                canvas.width = calculatedWidth * window.devicePixelRatio;
                canvas.height = canvasContainer.clientHeight * window.devicePixelRatio;
                drawTimeline();
            }

            window.addEventListener('resize', resizeCanvas);

            function getSupportedMimeType() {
                const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/aac', 'audio/ogg'];
                for (let t of types) {
                    if (MediaRecorder.isTypeSupported(t)) return t;
                }
                return '';
            }

            async function enableNoSleep() {
                try {
                    if ('wakeLock' in navigator) {
                        wakeLock = await navigator.wakeLock.request('screen');
                        wakeLockStatus.innerText = "スリープ防止: 有効（WakeLock）";
                    }
                } catch (err) {}

                try {
                    await noSleepVideo.play();
                    if (!wakeLock) {
                        wakeLockStatus.innerText = "スリープ防止: 有効（動画再生維持）";
                    }
                } catch (err) {}
            }

            function disableNoSleep() {
                if (wakeLock !== null) {
                    wakeLock.release().catch(() => {});
                    wakeLock = null;
                }
                noSleepVideo.pause();
                wakeLockStatus.innerText = "スリープ防止: 解除済み";
            }

            function enableDimmer() { dimmerOverlay.style.display = 'block'; }
            function disableDimmer() { dimmerOverlay.style.display = 'none'; }
            dimmerOverlay.addEventListener('click', () => { disableDimmer(); });

            toggleBtn.addEventListener('click', async () => {
                if (!isRunning) {
                    await startRecording();
                } else {
                    stopRecording();
                }
            });

            testBtn.addEventListener('click', () => {
                if (!isRunning) {
                    alert("先に「計測を開始する」を押してマイクを起動してください。");
                    return;
                }
                saveEvent('【テスト】音声切り出しテスト', 12, -15);
            });

            async function startRecording() {
                try {
                    const constraints = { audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } };
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioContext.state === 'suspended') {
                        await audioContext.resume();
                    }

                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 512;

                    microphone = audioContext.createMediaStreamSource(stream);
                    microphone.connect(analyser);

                    selectedMimeType = getSupportedMimeType();
                    const options = selectedMimeType ? { mimeType: selectedMimeType } : {};
                    mediaRecorder = new MediaRecorder(stream, options);

                    mimeStatus.innerText = "録音形式: " + (selectedMimeType || "デフォルト");

                    ringBuffer = [];
                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data && e.data.size > 0) {
                            ringBuffer.push(e.data);
                            if (ringBuffer.length > 15) ringBuffer.shift(); 
                        }
                    };
                    mediaRecorder.start(1000); 

                    isRunning = true;
                    toggleBtn.innerText = "計測を停止する";
                    toggleBtn.style.background = "var(--alert-red)";
                    liveStatus.innerText = "計測中...";

                    enableNoSleep();
                    enableDimmer();

                    resizeCanvas();
                    analyzeLoop();
                } catch (err) {
                    alert("マイクの起動に失敗しました: " + err.message);
                }
            }

            function stopRecording() {
                isRunning = false;
                if (audioContext) audioContext.close();
                if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
                
                disableNoSleep();
                disableDimmer();

                toggleBtn.innerText = "計測を開始する";
                toggleBtn.style.background = "var(--accent-green)";
                liveStatus.innerText = "停止中";
            }

            function analyzeLoop() {
                if (!isRunning) return;

                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(dataArray);

                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) sum += dataArray[i] * dataArray[i];
                let rms = Math.sqrt(sum / dataArray.length);
                let dbVal = rms > 0 ? 20 * Math.log10(rms / 255) : -100;
                dbVal = Math.max(-100, Math.min(0, dbVal));

                let type = 'normal';
                totalRecordedSeconds += 1;

                if (dbVal < SILENCE_DB) {
                    type = 'silence';
                    currentSilenceSec += 1;
                    if (currentSilenceSec > maxSilenceSec) maxSilenceSec = currentSilenceSec;
                } else {
                    if (currentSilenceSec >= MIN_SILENCE_SEC && dbVal > SPIKE_DB) {
                        type = 'alert';
                        saveEvent('無呼吸疑い（息の吹き返し）', currentSilenceSec, dbVal);
                    } else if (dbVal > SPIKE_DB) {
                        type = 'alert';
                        saveEvent('巨大いびき検知', 0, dbVal);
                    } else if (dbVal > SNORE_DB) {
                        type = 'snore';
                        snoreSeconds += 1;
                    }
                    currentSilenceSec = 0;
                }

                // 1秒ごとのデータを一時バッファへ蓄積
                secBuffer.push({ db: dbVal, type: type, timeStr: new Date().toLocaleTimeString('ja-JP', { hour: '2-digit', minute: '2-digit', second: '2-digit' }) });

                // 5秒経過したら最大値（ピーク）を集約してタイムラインデータに登録
                if (secBuffer.length >= DOWNSAMPLE_SEC) {
                    const maxItem = secBuffer.reduce((max, item) => item.db > max.db ? item : max, secBuffer[0]);
                    const hasAlert = secBuffer.some(item => item.type === 'alert');
                    const hasSnore = secBuffer.some(item => item.type === 'snore');
                    const finalType = hasAlert ? 'alert' : (hasSnore ? 'snore' : maxItem.type);

                    timelineData.push({
                        timeStr: maxItem.timeStr,
                        db: maxItem.db,
                        type: finalType
                    });

                    secBuffer = []; // バッファクリア
                    resizeCanvas();
                    
                    // 自動で最新の位置（右端）へスクロール
                    timelineWrapper.scrollLeft = timelineWrapper.scrollWidth;
                }

                updateSummary();
                setTimeout(analyzeLoop, 1000); 
            }

            // 音声切り出し・保存（ディープコピーでデータ完全化）
            function saveEvent(label, silenceSec, dbVal) {
                if (ringBuffer.length === 0) return;

                alertCount += 1;
                const audioChunks = ringBuffer.slice(0);
                const duration = audioChunks.length;
                const blob = new Blob(audioChunks, { type: selectedMimeType || 'audio/webm' });

                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = function() {
                    const base64AudioUrl = reader.result;
                    const nowObj = new Date();

                    const newEvent = {
                        timestamp: Date.now(),
                        dateStr: nowObj.toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                        dateOnly: nowObj.toLocaleDateString('ja-JP'),
                        label: label,
                        durationSec: duration,
                        detail: silenceSec > 0 ? `無音: ${silenceSec.toFixed(0)}秒 ➔ 復帰音: ${Math.round(dbVal)}dB` : `音量: ${Math.round(dbVal)}dB`,
                        url: base64AudioUrl,
                        type: silenceSec > 0 ? 'sas' : 'snore'
                    };

                    saveEventToDB(newEvent);
                    events.unshift(newEvent);
                    renderEvents();
                };
            }

            function updateSummary() {
                document.getElementById('summaryAlerts').innerText = `${alertCount} 回`;
                document.getElementById('summaryMaxSilence').innerText = `${maxSilenceSec.toFixed(0)} 秒`;
                const ratio = Math.round((snoreSeconds / Math.max(1, totalRecordedSeconds)) * 100);
                document.getElementById('summarySnoreRatio').innerText = `${ratio} %`;
            }

            // 軽量＆高可視化タイムライン描画処理
            function drawTimeline() {
                const w = canvas.width;
                const h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                if (timelineData.length === 0) return;

                const step = w / Math.max(timelineData.length, 1);
                const graphHeight = h - (25 * window.devicePixelRatio); // 下部25pxは時刻表記用

                for (let i = 0; i < timelineData.length; i++) {
                    const item = timelineData[i];
                    const barHeight = ((item.db + 100) / 100) * graphHeight;
                    const x = i * step;
                    const y = graphHeight - barHeight;

                    if (item.type === 'alert') {
                        ctx.fillStyle = '#ff5252';       
                        // 異常検知ポイントには天辺まで届く赤色の縦ラインマーカーを表示
                        ctx.fillRect(x, 0, Math.max(3, step), graphHeight);
                    } else if (item.type === 'snore') {
                        ctx.fillStyle = '#ffb300';  
                        ctx.fillRect(x, y, Math.max(2, step - 0.5), barHeight);
                    } else if (item.type === 'silence') {
                        ctx.fillStyle = '#333333';
                        ctx.fillRect(x, y, Math.max(2, step - 0.5), barHeight);
                    } else {
                        ctx.fillStyle = '#00e676';                             
                        ctx.fillRect(x, y, Math.max(2, step - 0.5), barHeight);
                    }

                    // 12データごと（5秒×12＝1分単位）に時刻の目盛りを描画
                    if (i % 12 === 0) {
                        ctx.fillStyle = '#aaaaaa';
                        ctx.font = `${10 * window.devicePixelRatio}px sans-serif`;
                        ctx.fillText(item.timeStr, x, h - (5 * window.devicePixelRatio));
                    }
                }
            }

            function renderEvents() {
                const listEl = document.getElementById('eventList');
                
                const targetDateObj = new Date();
                targetDateObj.setDate(targetDateObj.getDate() - activeDayIndex);
                const targetDateStr = targetDateObj.toLocaleDateString('ja-JP');

                const filteredEvents = events.filter(ev => {
                    const evDate = new Date(ev.timestamp).toLocaleDateString('ja-JP');
                    return evDate === targetDateStr;
                });

                if (filteredEvents.length === 0) {
                    listEl.innerHTML = '<p style="color: var(--text-sub); font-size: 0.85rem; text-align: center; padding: 12px 0;">この日の録音ログはありません。</p>';
                    return;
                }

                listEl.innerHTML = filteredEvents.map(ev => `
                    <div class="event-item">
                        <div>
                            <span class="event-tag ${ev.type === 'sas' ? 'tag-sas' : 'tag-snore'}">${ev.label}</span>
                            <span style="font-size:0.8rem; color:var(--text-sub);">[${ev.dateStr}]</span>
                        </div>
                        <div style="font-size:0.85rem; color:#eee; margin:4px 0;">
                            ${ev.detail} <span style="color:#81c784; font-size:0.75rem;">（録音長: ${ev.durationSec || 15}秒）</span>
                        </div>
                        <audio controls controlsList="nodownload" src="${ev.url}"></audio>
                    </div>
                `).join('');
            }

            resizeCanvas();
        });
    </script>
</body>
</html>
