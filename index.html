<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Snore & SAS Monitor Lite</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">

    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-green: #00e676;
            --warn-yellow: #ffb300;
            --alert-red: #ff5252;
            --text-main: #ffffff;
            --text-sub: #aaaaaa;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px;
            box-sizing: border-box;
        }
        h1 { font-size: 1.2rem; text-align: center; margin: 8px 0 16px; }
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .btn {
            width: 100%;
            padding: 14px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: var(--accent-green);
            color: #000;
            cursor: pointer;
            margin-bottom: 6px;
        }
        .btn-test {
            background: #333;
            color: #fff;
            padding: 10px;
            font-size: 0.85rem;
        }
        .btn-clear {
            background: #444;
            color: #ff5252;
            padding: 8px;
            font-size: 0.75rem;
            margin-top: 8px;
        }
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            text-align: center;
            margin-top: 8px;
        }
        .summary-item {
            background: #2a2a2a;
            padding: 8px;
            border-radius: 8px;
        }
        .summary-val {
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 4px;
        }
        /* スクロール可能なタイムラインコンテナ */
        .timeline-wrapper {
            width: 100%;
            overflow-x: auto;
            background: #080808;
            border-radius: 6px;
            margin-top: 8px;
            -webkit-overflow-scrolling: touch;
        }
        .canvas-container {
            height: 160px;
            position: relative;
            min-width: 100%;
        }
        canvas {
            height: 100%;
            display: block;
        }
        /* 日付ごとの背景色指定用クラス */
        .event-item {
            border-bottom: 1px solid #333;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 8px;
        }
        .day-group-0 { background-color: #24282e; } /* 当日 */
        .day-group-1 { background-color: #1f2a24; } /* 1日前 */
        .day-group-2 { background-color: #2d232a; } /* 2日前 */

        .event-tag {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .tag-sas { background: var(--alert-red); color: #fff; }
        .tag-snore { background: var(--warn-yellow); color: #000; }
        audio { width: 100%; height: 36px; margin-top: 6px; }
        .note { font-size: 0.75rem; color: var(--text-sub); text-align: center; }

        #dimmerOverlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #000000;
            opacity: 0.99;
            z-index: 99999;
            color: #333333;
            text-align: center;
            padding-top: 40vh;
            font-size: 0.85rem;
            box-sizing: border-box;
            user-select: none;
        }
    </style>
</head>
<body>

    <div id="dimmerOverlay">
        画面をタップすると表示が戻ります<br>
        <span style="font-size:0.75rem; color:#222;">(計測継続中)</span>
    </div>

    <video id="noSleepVideo" playsinline loop muted style="display:none; width:1px; height:1px;">
        <source src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28ybXA0MQAAAAhmcmVlAAAAAG1kYXQAAAA=" type="video/mp4">
    </video>

    <h1>いびき・SAS 睡眠モニター</h1>

    <div class="card">
        <button id="toggleBtn" class="btn">計測を開始する</button>
        <button id="testBtn" class="btn btn-test">動作テスト（15秒切り出し再生）</button>
        <div id="wakeLockStatus" class="note">スリープ防止: 未設定</div>
        <div id="mimeStatus" class="note" style="color:#81c784; margin-top:4px;"></div>
    </div>

    <div class="card">
        <div style="font-weight: bold; font-size: 0.9rem;">昨夜の計測サマリー</div>
        <div class="summary-grid">
            <div class="summary-item">
                <div style="font-size: 0.75rem; color: var(--text-sub);">危険検知</div>
                <div id="summaryAlerts" class="summary-val" style="color: var(--alert-red);">0 回</div>
            </div>
            <div class="summary-item">
                <div style="font-size: 0.75rem; color: var(--text-sub);">最長無音</div>
                <div id="summaryMaxSilence" class="summary-val">0 秒</div>
            </div>
            <div class="summary-item">
                <div style="font-size: 0.75rem; color: var(--text-sub);">いびき率</div>
                <div id="summarySnoreRatio" class="summary-val">0 %</div>
            </div>
        </div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; font-size: 0.85rem;">
            <span>音量タイムライン（横スクロール可能）</span>
            <span id="liveStatus" style="color: var(--accent-green);">停止中</span>
        </div>
        <div class="timeline-wrapper" id="timelineWrapper">
            <div class="canvas-container" id="canvasContainer">
                <canvas id="timelineCanvas"></canvas>
            </div>
        </div>
    </div>

    <div class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
            <div style="font-weight: bold; font-size: 0.9rem;">
                危険音声保存ログ (過去3日分) (<span id="eventCount">0</span>)
            </div>
        </div>
        <div id="eventList">
            <p style="color: var(--text-sub); font-size: 0.85rem;">過去3日分の保存データはありません。</p>
        </div>
        <button id="clearBtn" class="btn btn-clear">保存ログをすべて削除</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const SILENCE_DB = -45;
            const SNORE_DB = -30;
            const SPIKE_DB = -20;
            const MIN_SILENCE_SEC = 10;
            const RETENTION_DAYS = 3;

            let audioContext, analyser, microphone, mediaRecorder;
            let wakeLock = null;
            let isRunning = false;
            let selectedMimeType = '';
            let db;
            
            let timelineData = []; 
            let ringBuffer = [];   
            let events = [];       

            let currentSilenceSec = 0;
            let maxSilenceSec = 0;
            let alertCount = 0;
            let snoreSeconds = 0;
            let totalRecordedSeconds = 0;

            const toggleBtn = document.getElementById('toggleBtn');
            const testBtn = document.getElementById('testBtn');
            const clearBtn = document.getElementById('clearBtn');
            const liveStatus = document.getElementById('liveStatus');
            const wakeLockStatus = document.getElementById('wakeLockStatus');
            const mimeStatus = document.getElementById('mimeStatus');
            const canvas = document.getElementById('timelineCanvas');
            const canvasContainer = document.getElementById('canvasContainer');
            const timelineWrapper = document.getElementById('timelineWrapper');
            const ctx = canvas.getContext('2d');
            const dimmerOverlay = document.getElementById('dimmerOverlay');
            const noSleepVideo = document.getElementById('noSleepVideo');

            // IndexedDB 構築
            const dbReq = indexedDB.open('SnoreSASMonitorDB', 1);
            dbReq.onupgradeneeded = (e) => {
                const database = e.target.result;
                if (!database.objectStoreNames.contains('events')) {
                    database.createObjectStore('events', { keyPath: 'id', autoIncrement: true });
                }
            };
            dbReq.onsuccess = (e) => {
                db = e.target.result;
                loadEventsFromDB();
            };

            function saveEventToDB(eventObj) {
                if (!db) return;
                const tx = db.transaction('events', 'readwrite');
                tx.objectStore('events').add(eventObj);
            }

            function loadEventsFromDB() {
                if (!db) return;
                const tx = db.transaction('events', 'readonly');
                const store = tx.objectStore('events');
                const req = store.getAll();
                req.onsuccess = () => {
                    const now = Date.now();
                    const expireTime = RETENTION_DAYS * 24 * 60 * 60 * 1000;
                    
                    events = req.result.filter(item => {
                        if (now - item.timestamp > expireTime) {
                            deleteEventFromDB(item.id);
                            return false;
                        }
                        return true;
                    }).reverse();

                    renderEvents();
                };
            }

            function deleteEventFromDB(id) {
                if (!db) return;
                const tx = db.transaction('events', 'readwrite');
                tx.objectStore('events').delete(id);
            }

            clearBtn.addEventListener('click', () => {
                if (confirm("過去3日分の保存音声ログをすべて削除しますか？")) {
                    if (!db) return;
                    const tx = db.transaction('events', 'readwrite');
                    tx.objectStore('events').clear();
                    events = [];
                    renderEvents();
                }
            });

            // タイムライン描画用キャンバスサイズ（スクロール可能設定）
            function resizeCanvas() {
                if (!canvas) return;
                const minWidth = timelineWrapper.clientWidth;
                // データ1点ごとに3px幅を確保してスクロール可能に設定
                const calculatedWidth = Math.max(minWidth, timelineData.length * 3);
                
                canvasContainer.style.width = calculatedWidth + 'px';
                canvas.width = calculatedWidth * window.devicePixelRatio;
                canvas.height = canvasContainer.clientHeight * window.devicePixelRatio;
                drawTimeline();
            }

            window.addEventListener('resize', resizeCanvas);

            function getSupportedMimeType() {
                const types = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/aac', 'audio/ogg'];
                for (let t of types) {
                    if (MediaRecorder.isTypeSupported(t)) return t;
                }
                return '';
            }

            async function enableNoSleep() {
                try {
                    if ('wakeLock' in navigator) {
                        wakeLock = await navigator.wakeLock.request('screen');
                        wakeLockStatus.innerText = "スリープ防止: 有効（WakeLock）";
                    }
                } catch (err) {}

                try {
                    await noSleepVideo.play();
                    if (!wakeLock) {
                        wakeLockStatus.innerText = "スリープ防止: 有効（動画再生維持）";
                    }
                } catch (err) {}
            }

            function disableNoSleep() {
                if (wakeLock !== null) {
                    wakeLock.release().catch(() => {});
                    wakeLock = null;
                }
                noSleepVideo.pause();
                wakeLockStatus.innerText = "スリープ防止: 解除済み";
            }

            function enableDimmer() { dimmerOverlay.style.display = 'block'; }
            function disableDimmer() { dimmerOverlay.style.display = 'none'; }
            dimmerOverlay.addEventListener('click', () => { disableDimmer(); });

            toggleBtn.addEventListener('click', async () => {
                if (!isRunning) {
                    await startRecording();
                } else {
                    stopRecording();
                }
            });

            testBtn.addEventListener('click', () => {
                if (!isRunning) {
                    alert("先に「計測を開始する」を押してマイクを起動してください。");
                    return;
                }
                saveEvent('【テスト】音声切り出しテスト', 12, -15);
            });

            async function startRecording() {
                try {
                    const constraints = { audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } };
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    
                    audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    if (audioContext.state === 'suspended') {
                        await audioContext.resume();
                    }

                    analyser = audioContext.createAnalyser();
                    analyser.fftSize = 512;

                    microphone = audioContext.createMediaStreamSource(stream);
                    microphone.connect(analyser);

                    selectedMimeType = getSupportedMimeType();
                    const options = selectedMimeType ? { mimeType: selectedMimeType } : {};
                    mediaRecorder = new MediaRecorder(stream, options);

                    mimeStatus.innerText = "録音形式: " + (selectedMimeType || "デフォルト");

                    ringBuffer = [];
                    mediaRecorder.ondataavailable = (e) => {
                        if (e.data && e.data.size > 0) {
                            ringBuffer.push(e.data);
                            if (ringBuffer.length > 15) ringBuffer.shift(); // 直近15秒保持
                        }
                    };
                    mediaRecorder.start(1000); 

                    isRunning = true;
                    toggleBtn.innerText = "計測を停止する";
                    toggleBtn.style.background = "var(--alert-red)";
                    liveStatus.innerText = "計測中...";

                    enableNoSleep();
                    enableDimmer();

                    resizeCanvas();
                    analyzeLoop();
                } catch (err) {
                    alert("マイクの起動に失敗しました: " + err.message);
                }
            }

            function stopRecording() {
                isRunning = false;
                if (audioContext) audioContext.close();
                if (mediaRecorder && mediaRecorder.state !== "inactive") mediaRecorder.stop();
                
                disableNoSleep();
                disableDimmer();

                toggleBtn.innerText = "計測を開始する";
                toggleBtn.style.background = "var(--accent-green)";
                liveStatus.innerText = "停止中";
            }

            function analyzeLoop() {
                if (!isRunning) return;

                const dataArray = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(dataArray);

                let sum = 0;
                for (let i = 0; i < dataArray.length; i++) sum += dataArray[i] * dataArray[i];
                let rms = Math.sqrt(sum / dataArray.length);
                let dbVal = rms > 0 ? 20 * Math.log10(rms / 255) : -100;
                dbVal = Math.max(-100, Math.min(0, dbVal));

                let type = 'normal';
                totalRecordedSeconds += 1;

                if (dbVal < SILENCE_DB) {
                    type = 'silence';
                    currentSilenceSec += 1;
                    if (currentSilenceSec > maxSilenceSec) maxSilenceSec = currentSilenceSec;
                } else {
                    if (currentSilenceSec >= MIN_SILENCE_SEC && dbVal > SPIKE_DB) {
                        type = 'alert';
                        saveEvent('無呼吸疑い（息の吹き返し）', currentSilenceSec, dbVal);
                    } else if (dbVal > SPIKE_DB) {
                        type = 'alert';
                        saveEvent('巨大いびき検知', 0, dbVal);
                    } else if (dbVal > SNORE_DB) {
                        type = 'snore';
                        snoreSeconds += 1;
                    }
                    currentSilenceSec = 0;
                }

                timelineData.push({ time: new Date().toLocaleTimeString(), db: dbVal, type: type });

                updateSummary();
                resizeCanvas();
                
                // 自動で右端（最新値）へスクロール
                timelineWrapper.scrollLeft = timelineWrapper.scrollWidth;

                setTimeout(analyzeLoop, 1000); 
            }

            function saveEvent(label, silenceSec, dbVal) {
                if (ringBuffer.length === 0) return;

                alertCount += 1;
                const duration = ringBuffer.length; // 実際に記録された秒数
                const blob = new Blob([...ringBuffer], { type: selectedMimeType || 'audio/webm' });

                const reader = new FileReader();
                reader.readAsDataURL(blob);
                reader.onloadend = function() {
                    const base64AudioUrl = reader.result;

                    const newEvent = {
                        timestamp: Date.now(),
                        dateStr: new Date().toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' }),
                        dateOnly: new Date().toLocaleDateString(),
                        label: label,
                        durationSec: duration,
                        detail: silenceSec > 0 ? `無音: ${silenceSec.toFixed(0)}秒 ➔ 復帰音: ${Math.round(dbVal)}dB` : `音量: ${Math.round(dbVal)}dB`,
                        url: base64AudioUrl,
                        type: silenceSec > 0 ? 'sas' : 'snore'
                    };

                    saveEventToDB(newEvent);
                    events.unshift(newEvent);
                    renderEvents();
                };
            }

            function updateSummary() {
                document.getElementById('summaryAlerts').innerText = `${alertCount} 回`;
                document.getElementById('summaryMaxSilence').innerText = `${maxSilenceSec.toFixed(0)} 秒`;
                const ratio = Math.round((snoreSeconds / Math.max(1, totalRecordedSeconds)) * 100);
                document.getElementById('summarySnoreRatio').innerText = `${ratio} %`;
            }

            // 時刻目盛り付きタイムライン描画機能
            function drawTimeline() {
                const w = canvas.width;
                const h = canvas.height;
                ctx.clearRect(0, 0, w, h);

                if (timelineData.length === 0) return;

                const step = w / timelineData.length;
                const graphHeight = h - (30 * window.devicePixelRatio); // 下部30pxは時刻目盛り用

                for (let i = 0; i < timelineData.length; i++) {
                    const item = timelineData[i];
                    const barHeight = ((item.db + 100) / 100) * graphHeight;
                    const x = i * step;
                    const y = graphHeight - barHeight;

                    // 音量バーの色分け
                    if (item.type === 'alert') {
                        ctx.fillStyle = '#ff5252';       
                        // 危険検知ポイントに縦ラインマーカーを描画
                        ctx.fillRect(x, 0, Math.max(2, step), graphHeight);
                    } else if (item.type === 'snore') {
                        ctx.fillStyle = '#ffb300';  
                    } else if (item.type === 'silence') {
                        ctx.fillStyle = '#333333';
                    } else {
                        ctx.fillStyle = '#00e676';                             
                    }

                    ctx.fillRect(x, y, Math.max(2, step - 1), barHeight);

                    // 30データごと（30秒刻み）に時刻の目盛りを描画
                    if (i % 30 === 0) {
                        ctx.fillStyle = '#aaaaaa';
                        ctx.font = `${10 * window.devicePixelRatio}px sans-serif`;
                        ctx.fillText(item.time, x, h - (5 * window.devicePixelRatio));
                        
                        ctx.strokeStyle = '#333333';
                        ctx.beginPath();
                        ctx.moveTo(x, graphHeight);
                        ctx.lineTo(x, graphHeight + (5 * window.devicePixelRatio));
                        ctx.stroke();
                    }
                }
            }

            // 日付ごとに色分けしてイベントログを一覧描画
            function renderEvents() {
                document.getElementById('eventCount').innerText = events.length;
                const listEl = document.getElementById('eventList');
                
                if (events.length === 0) {
                    listEl.innerHTML = '<p style="color: var(--text-sub); font-size: 0.85rem;">過去3日分の保存データはありません。</p>';
                    return;
                }

                // ユニークな日付を取得して日付インデックスマップを作成
                const uniqueDates = [...new Set(events.map(ev => ev.dateOnly || ev.dateStr.split(' ')[0]))];

                listEl.innerHTML = events.map(ev => {
                    const dateKey = ev.dateOnly || ev.dateStr.split(' ')[0];
                    const dayIndex = uniqueDates.indexOf(dateKey) % 3; // 0, 1, 2のカラーグループに割り当て
                    const durationText = ev.durationSec ? `（録音長: ${ev.durationSec}秒）` : '';

                    return `
                        <div class="event-item day-group-${dayIndex}">
                            <div>
                                <span class="event-tag ${ev.type === 'sas' ? 'tag-sas' : 'tag-snore'}">${ev.label}</span>
                                <span style="font-size:0.8rem; color:var(--text-sub);">[${ev.dateStr}]</span>
                            </div>
                            <div style="font-size:0.85rem; color:#eee; margin:4px 0;">
                                ${ev.detail} <span style="color:#81c784; font-size:0.75rem;">${durationText}</span>
                            </div>
                            <audio controls controlsList="nodownload" src="${ev.url}"></audio>
                        </div>
                    `;
                }).join('');
            }
        });
    </script>
</body>
</html>
